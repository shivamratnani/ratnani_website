name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Build-time placeholders. Data fetching is request-time, so these only
          # need to satisfy schema validation, never to authenticate.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPOTIFY_CLIENT_ID: ci
          SPOTIFY_CLIENT_SECRET: ci
          SPOTIFY_REFRESH_TOKEN: ci
          UPSTASH_REDIS_REST_URL: https://ci.invalid
          UPSTASH_REDIS_REST_TOKEN: ci
          RESEND_API_KEY: ci
          CONTACT_TO_EMAIL: ci@example.com
          CRON_SECRET: ci-placeholder-secret-value
